<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PartyHop</title>
<meta name="description" content="PartyHop for the PartyHop app.">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--muted:#F7F7F7;--border:#E5E5E5;--text:#3C3C3C;--text2:#6F6F6F;--brand:#FF2D6F;--accent:#7A3FD1;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#131619;--muted:#1C2024;--border:#353B42;--text:#ECEEF0;--text2:#A3A9AF;--accent:#A77BF0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:600 17px/1.6 Nunito,system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
header{background:var(--brand);color:#fff;padding:20px 16px}
header a{color:#fff;text-decoration:none;font-weight:900;font-size:22px}
main{max-width:720px;margin:0 auto;padding:24px 16px 64px}
h1{font-weight:900;font-size:32px;line-height:1.2;margin:8px 0 4px}
h2{font-weight:800;font-size:21px;line-height:1.3;margin:32px 0 8px}
p,li{margin:0 0 12px}
ul{padding-left:22px;margin:0 0 12px}
strong{font-weight:800}
a{color:var(--accent)}
.meta{color:var(--text2);margin-bottom:24px}
footer{border-top:1px solid var(--border);color:var(--text2);font-size:15px;padding:20px 16px;text-align:center}
footer a{color:var(--text2);margin:0 8px}
</style>
</head>
<body>
<header><a href="/">PartyHop</a></header>
<main>
<h1>PartyHop</h1>
<p class="meta">Plan parties with friends and keep track of your days with and without them.</p>
<p>Coming soon to the App Store.</p>
<p><a href="/privacy">Privacy Policy</a> · <a href="/terms">Terms of Use</a> · <a href="mailto:support@partyhop.app">Contact</a></p>
</main>
<footer><a href="/privacy">Privacy Policy</a><a href="/terms">Terms of Use</a></footer>
</body>
</html>
